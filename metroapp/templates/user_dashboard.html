<!DOCTYPE html>
<html>
<head>
  <title>User Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url("{{ url_for('static', filename='background2.png') }}");
      background-size: cover;
      background-position: center;
      height: 100vh;
      color: white;
    }

    .welcome {
      position: absolute;
      top: 20px;
      left: 30px;
      color: #ffcc00; /* Bright gold-yellow */
      font-size: 28px;
      font-weight: 700;
      font-family: 'Segoe UI', sans-serif;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7); /* Adds contrast without background */
    }


    .logout-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 8px;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s ease;
      z-index: 10;
    }

    .logout-button img {
      width: 24px;
      height: 24px;
      display: block;
    }

    .logout-button:hover {
      background-color: rgba(255, 255, 255, 1);
    }

    .dashboard-options {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 20px;
    }

    .btn {
      display: block;
      text-align: center;
      padding: 20px 40px;
      background: linear-gradient(to right, #ffb347, #ffcc33); /* warm amber gradient */
      color: #1a1a1a;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
      width: 300px;
      margin: 20px auto;
      box-shadow: 0 8px 20px rgba(255, 204, 51, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255, 204, 51, 0.6);
    }

  </style>
</head>
<body>

<div class="welcome">Welcome, {{ user_id }}</div>

<a href="{{ url_for('logout') }}" class="logout-button" title="Logout">
  <img src="{{ url_for('static', filename='logout.jpg') }}" alt="Logout">
</a>

<div class="dashboard-options">
  <a href="{{ url_for('view_schedule') }}" class="btn">View Train Schedule</a>
  <a href="{{ url_for('view_routes') }}" class="btn">Check Train Routes</a>
  <a href="{{ url_for('book_ticket', user_id=user_id) }}" class="btn">Book a Train</a>
  <a href="{{ url_for('view_history', user_id=user_id) }}" class="btn">View Booking History</a>



</div>

</body>
</html>
