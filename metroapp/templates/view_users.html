<!DOCTYPE html>
<html>
<head>
  <title>View Users</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url("{{ url_for('static', filename='background.jpg.png') }}");
      background-size: cover;
      background-position: center;
      height: 100vh;
      color: white;
    }

    .welcome {
      position: absolute;
      top: 20px;
      left: 20px;
      color: black;
      font-size: 28px;
      font-weight: bold;
      font-family: 'Georgia', serif;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px 20px;
      border-radius: 8px;
    }

    .logout-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 8px;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s ease;
      z-index: 10;
    }

    .logout-button img {
      width: 24px;
      height: 24px;
      display: block;
    }

    .logout-button:hover {
      background-color: rgba(255, 255, 255, 1);
    }

    .container {
      padding-top: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      font-size: 36px;
      margin-bottom: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px 30px;
      border-radius: 10px;
    }

    .filter-section {
      margin-bottom: 20px;
    }

    .filter-section select {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    table {
      width: 80%;
      background-color: rgba(255, 255, 255, 0.9);
      color: black;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background-color: #333;
      color: white;
    }

    .btn-delete {
      color: white;
      background-color: red;
      padding: 6px 12px;
      border-radius: 5px;
      text-decoration: none;
    }

    .btn-delete:hover {
      background-color: darkred;
    }

    .not-deletable {
      color: gray;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="welcome">Welcome, Admin</div>

<a href="{{ url_for('logout') }}" class="logout-button" title="Logout">
  <img src="{{ url_for('static', filename='logout.jpg') }}" alt="Logout">
</a>

<div class="container">
  <h2>Registered Users</h2>

  <div class="filter-section">
    <form method="get" action="{{ url_for('view_users') }}">
      <label for="filter">Filter:</label>
      <select name="filter" id="filter" onchange="this.form.submit()">
        <option value="all" {% if filter_type == 'all' %}selected{% endif %}>All Users</option>
        <option value="no_passenger" {% if filter_type == 'no_passenger' %}selected{% endif %}>Non-Passenger Users</option>
      </select>
    </form>
  </div>

  <table>
    <thead>
    <tr>
      <th>User ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.user_id }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td>
        {% if user.user_id not in passenger_ids %}
        <a href="{{ url_for('delete_user', user_id=user.user_id) }}" class="btn-delete"
           onclick="return confirm('Are you sure you want to delete this user?');">
          Delete
        </a>
        {% else %}
        <span class="not-deletable" title="This user is a passenger and cannot be deleted.">N/A</span>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
</div>

</body>
</html>
