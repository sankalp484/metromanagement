<!-- templates/update_user.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Update User</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h2>Update User: {{ user.user_id }}</h2>
    <form method="post">
      <label>Full Name:</label><br>
      <input type="text" name="full_name" value="{{ user.full_name }}" required><br><br>
      
      <label>Email:</label><br>
      <input type="email" name="email" value="{{ user.email }}" required><br><br>

      <label>Phone:</label><br>
      <input type="text" name="phone" value="{{ user.phone }}" required><br><br>

      <label>Passcode:</label><br>
      <input type="password" name="passcode" value="{{ user.passcode }}" required><br><br>

      <button type="submit">Update</button>
      <a href="{{ url_for('view_all_users') }}">Cancel</a>
    </form>
  </div>
</body>
</html>
